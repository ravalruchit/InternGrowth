; ── PHP Runtime Settings for Production ───────────────────────────────────────
; Uploaded to /usr/local/etc/php/conf.d/ by the Dockerfile

; Allow file uploads up to 12M (college ID images can be ~10MB)
upload_max_filesize = 12M
post_max_size = 14M

; Increase memory for AI image processing (GD compression)
memory_limit = 256M

; Give PHP enough time for AI API calls (Gemini can take 30s+)
max_execution_time = 120
max_input_time = 120
